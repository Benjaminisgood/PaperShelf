<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperShelf · Word</title><link rel="stylesheet" href="/style.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script type="module" src="/app.mjs"></script></head>
<body><header><img src="/icon.png" width="32" height="32" alt=""><div><h1>PaperShelf</h1><p>文献、引文与参考文献</p></div></header>
<main><label for="query">搜索书库</label><input id="query" type="search" placeholder="标题、作者、DOI…" autocomplete="off"><div id="results" aria-live="polite"></div><nav><button id="previous" disabled>上一页</button><span id="page"></span><button id="next" disabled>下一页</button></nav><p id="selection-count">0 篇已选</p>
<label for="style">CSL 格式</label><select id="style"></select><label for="custom-style">导入自定义 CSL（保存在当前文档）</label><input id="custom-style" type="file" accept=".csl,application/xml,text/xml"><label for="locator">页码（应用于本次所选文献，可选）</label><input id="locator" placeholder="例如 12–15"><button id="insert" class="primary" data-document-action disabled>在光标处插入引文</button><div class="actions"><button id="bibliography" data-document-action disabled>插入参考文献表</button><button id="refresh" data-document-action disabled>刷新文档 / 应用格式</button></div><p id="status" role="status">正在连接…</p><button id="reconnect">重新连接</button>
<details><summary>使用说明</summary><p>删除引文后点击刷新，编号和参考文献表会重新计算。移动已有引文后也需刷新。复制粘贴产生的重复引文控件需要重新插入。已有文献元数据随文档保存；从书库重新插入可更新其元数据。</p><p>支持 CSL 排序、编号、消歧、斜体、上下标与参考文献悬挂缩进。自定义样式仅接受安全的文字排版；请使用正文引文样式。</p></details></main>
<footer>引文格式由 <a href="https://citeproc-js.readthedocs.io/" target="_blank" rel="noreferrer">citeproc-js</a> 提供，© 2009–2019 Frank Bennett。<a href="/licenses" target="_blank">许可与源码</a></footer></body></html>
