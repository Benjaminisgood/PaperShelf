name: papershelf-graph
services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPERSHELF_NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${PAPERSHELF_NEO4J_BOLT_PORT:-17687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your environment}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - papershelf-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  papershelf-neo4j:
